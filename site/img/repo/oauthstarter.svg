<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="oauthstarter">
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(56 96)">
    <rect x="0" y="0" width="100" height="108" fill="#ede1c8" stroke="#1a1f2e" stroke-width="1.5"/>
    <text x="50" y="22" font-family="Georgia, serif" font-size="11" fill="#1a1f2e" font-weight="700" text-anchor="middle">user</text>
    <text x="50" y="64" font-family="Georgia, serif" font-size="32" text-anchor="middle">&#x1F464;</text>
    <text x="50" y="98" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" opacity="0.55" text-anchor="middle">consents</text>
  </g>
  <g transform="translate(244 96)">
    <rect x="0" y="0" width="100" height="108" fill="#7f0000"/>
    <text x="50" y="22" font-family="Georgia, serif" font-size="11" fill="#f4ecd8" font-weight="700" text-anchor="middle">app engine</text>
    <g transform="translate(50 56)">
      <rect x="-12" y="-10" width="24" height="20" fill="#d49431"/>
      <circle cx="-8" cy="-10" r="6" fill="none" stroke="#d49431" stroke-width="3"/>
      <circle cx="0" cy="0" r="2" fill="#7f0000"/>
    </g>
    <text x="50" y="98" font-family="Georgia, serif" font-size="9" fill="#f4ecd8" opacity="0.7" text-anchor="middle">stores token</text>
  </g>
  <g transform="translate(160 130)" stroke-linecap="round" font-family="Georgia, serif" font-size="9" fill="#1a1f2e">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1a1f2e" stroke-width="1.5"/>
    <polygon points="74,-4 84,0 74,4" fill="#1a1f2e"/>
    <text x="42" y="-6" text-anchor="middle" opacity="0.7">authorize</text>
    <line x1="0" y1="32" x2="80" y2="32" stroke="#7f0000" stroke-width="1.5"/>
    <polygon points="6,28 -4,32 6,36" fill="#7f0000"/>
    <text x="42" y="48" text-anchor="middle" fill="#7f0000" font-weight="700">access token</text>
  </g>
  <text x="56" y="48" font-family="Georgia, serif" font-size="14" font-weight="800" fill="#1a1f2e" letter-spacing="0.04em">OAUTH</text>
  <line x1="56" y1="56" x2="148" y2="56" stroke="#7f0000" stroke-width="2"/>
