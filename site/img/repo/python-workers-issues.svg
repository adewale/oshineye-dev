<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="python-workers-issues">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="320" height="36" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="5" fill="#7f0000"/>
    <text x="32" y="14" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1a1f2e">#42 · pyodide hangs on async fetch retry</text>
    <text x="32" y="28" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" opacity="0.6">opened in py-workers · repro in 12 lines</text>
  </g>
  <g transform="translate(40 90)">
    <rect x="0" y="0" width="320" height="36" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="5" fill="#d49431"/>
    <text x="32" y="14" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1a1f2e">#43 · ffi: bytes ↔ str round-trips</text>
    <text x="32" y="28" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" opacity="0.6">workaround posted · pinned</text>
  </g>
  <g transform="translate(40 140)">
    <rect x="0" y="0" width="320" height="36" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="5" fill="#6e8855"/>
    <text x="32" y="14" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1a1f2e">#44 · durable storage: closed-cb timing</text>
    <text x="32" y="28" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" opacity="0.6">fixed in 0.2.4 · keep for reference</text>
  </g>
  <g transform="translate(40 200)">
    <rect x="0" y="0" width="320" height="50" fill="#1a1f2e"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="9">
      <text x="10" y="14" fill="#d49431">▸ python -m repro_42</text>
      <text x="10" y="28" fill="#f4ecd8" opacity="0.55">awaiting fetch (attempt 2)…</text>
      <text x="10" y="42" fill="#7f0000">HANG · timeout 30s</text>
    </g>
  </g>
  <text x="40" y="278" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">self-contained reproductions</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
