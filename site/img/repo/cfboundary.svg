<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="cfboundary">
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g stroke="#1a1f2e" stroke-width="0.4" opacity="0.18">
    <line x1="20" y1="80" x2="380" y2="80"/>
    <line x1="20" y1="220" x2="380" y2="220"/>
  </g>
  <g transform="translate(40 100)">
    <rect x="0" y="0" width="140" height="100" fill="#ede1c8" stroke="#1a1f2e" stroke-width="1"/>
    <text x="70" y="20" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1a1f2e" text-anchor="middle">trusted</text>
    <line x1="14" y1="28" x2="126" y2="28" stroke="#1a1f2e" stroke-width="0.6" opacity="0.5"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1a1f2e" transform="translate(14 44)">
      <text y="0" opacity="0.75">def handle(req:</text>
      <text y="14" opacity="0.75">  Request) ->; </text>
      <text y="28" opacity="0.75">  Response: ...</text>
    </g>
  </g>
  <g transform="translate(220 100)">
    <rect x="0" y="0" width="140" height="100" fill="#1a1f2e"/>
    <text x="70" y="20" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#f4ecd8" text-anchor="middle">untrusted</text>
    <line x1="14" y1="28" x2="126" y2="28" stroke="#f4ecd8" stroke-width="0.6" opacity="0.5"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#f4ecd8" transform="translate(14 44)">
      <text y="0" opacity="0.65">str | bytes | dict</text>
      <text y="14" opacity="0.65">{ user input }</text>
      <text y="28" opacity="0.65">network · disk</text>
    </g>
  </g>
  <g transform="translate(180 80) rotate(0)">
    <rect x="0" y="0" width="40" height="140" fill="#7f0000"/>
    <g fill="#f4ecd8" font-family="Georgia, serif" font-size="9" font-weight="800">
      <text x="20" y="34" text-anchor="middle">B</text>
      <text x="20" y="54" text-anchor="middle">N</text>
      <text x="20" y="74" text-anchor="middle">D</text>
      <text x="20" y="94" text-anchor="middle">R</text>
      <text x="20" y="114" text-anchor="middle">Y</text>
    </g>
  </g>
  <g stroke="#7f0000" stroke-width="1.4" stroke-dasharray="3 3" fill="none">
    <line x1="200" y1="40" x2="200" y2="80"/>
    <line x1="200" y1="220" x2="200" y2="260"/>
  </g>
  <text x="40" y="50" font-family="Georgia, serif" font-size="11" font-weight="800" fill="#1a1f2e" letter-spacing="0.04em">TYPED BOUNDARY</text>
  <text x="40" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">parse, don't validate</text>
</svg>
