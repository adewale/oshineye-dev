<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="claude-history-explorer">
  <rect width="400" height="300" fill="#1a1f2e"/>
  <rect x="32" y="36" width="336" height="232" rx="4" fill="#0f1320" stroke="#2a3148" stroke-width="1"/>
  <g transform="translate(32 36)">
    <rect x="0" y="0" width="336" height="22" fill="#2a3148"/>
    <circle cx="14" cy="11" r="3.5" fill="#7f0000"/>
    <circle cx="28" cy="11" r="3.5" fill="#d49431"/>
    <circle cx="42" cy="11" r="3.5" fill="#6e8855"/>
    <text x="168" y="15" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#f4ecd8" opacity="0.5" text-anchor="middle">~/.claude/history</text>
  </g>
  <g transform="translate(48 70)" font-family="ui-monospace, Menlo, monospace" font-size="10">
    <text x="0" y="0" fill="#d49431">$ claude-history grep "garten"</text>
    <line x1="0" y1="14" x2="304" y2="14" stroke="#2a3148" stroke-width="0.5"/>
    <text x="0" y="32" fill="#f4ecd8" opacity="0.55">2026-03-04 · designing the garden</text>
    <text x="0" y="48" fill="#f4ecd8" opacity="0.55">2026-03-12 · adding pollinators</text>
    <rect x="-6" y="55" width="312" height="18" fill="#7f0000" opacity="0.25"/>
    <text x="0" y="68" fill="#f4ecd8" font-weight="700">2026-03-18 · plotting <tspan fill="#7f0000" font-weight="800">garten</tspan> palette</text>
    <text x="0" y="84" fill="#f4ecd8" opacity="0.55">2026-04-02 · garten + accent oklch</text>
    <text x="0" y="100" fill="#f4ecd8" opacity="0.55">2026-04-09 · garten 0.2 release notes</text>
    <text x="0" y="116" fill="#f4ecd8" opacity="0.55">2026-04-23 · garten in oshineye-dev</text>
  </g>
  <g transform="translate(48 220)" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#f4ecd8" opacity="0.55">
    <text x="0" y="0">6 matches across 18.4k turns</text>
  </g>
