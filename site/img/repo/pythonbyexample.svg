<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="pythonbyexample">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="200" height="220" fill="#1a1f2e"/>
    <rect x="0" y="0" width="200" height="22" fill="#0f1320"/>
    <circle cx="12" cy="11" r="3" fill="#7f0000"/>
    <circle cx="24" cy="11" r="3" fill="#d49431"/>
    <circle cx="36" cy="11" r="3" fill="#6e8855"/>
    <text x="106" y="15" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#f4ecd8" opacity="0.5" text-anchor="middle">hello_world.py</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" transform="translate(14 44)">
      <text y="0"><tspan fill="#a83838">from</tspan> <tspan fill="#f4ecd8">workers</tspan> <tspan fill="#a83838">import</tspan> <tspan fill="#f4ecd8">Response</tspan></text>
      <text y="20"></text>
      <text y="40"><tspan fill="#a83838">async def</tspan> <tspan fill="#d49431">on_fetch</tspan>(<tspan fill="#f4ecd8">req</tspan>, <tspan fill="#f4ecd8">env</tspan>):</text>
      <text y="60">    <tspan fill="#a83838">return</tspan> <tspan fill="#f4ecd8">Response</tspan>(</text>
      <text y="80">        <tspan fill="#6e8855">"hello, py 3.13"</tspan></text>
      <text y="100">    )</text>
      <text y="132" fill="#f4ecd8" opacity="0.5">▸ run</text>
      <rect x="-2" y="124" width="40" height="14" fill="#7f0000" opacity="0.85"/>
      <text y="134" x="2" fill="#f4ecd8" font-weight="700">▸ run</text>
    </g>
  </g>
  <g transform="translate(264 76)">
    <rect x="0" y="0" width="88" height="48" fill="#faf3e0" stroke="#1a1f2e" stroke-width="1"/>
    <text x="44" y="20" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1a1f2e" text-anchor="middle">200 OK</text>
    <text x="44" y="36" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1a1f2e" opacity="0.7" text-anchor="middle">hello, py 3.13</text>
  </g>
  <g transform="translate(264 144)">
    <rect x="0" y="0" width="88" height="60" fill="#d49431"/>
    <text x="44" y="18" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#1a1f2e" text-anchor="middle">try it</text>
    <text x="44" y="36" font-family="Georgia, serif" font-size="8" fill="#1a1f2e" opacity="0.75" text-anchor="middle">edit + rerun</text>
    <text x="44" y="50" font-family="Georgia, serif" font-size="8" fill="#1a1f2e" opacity="0.75" text-anchor="middle">on workers</text>
  </g>
  <text x="40" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">python 3.13 by example</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
