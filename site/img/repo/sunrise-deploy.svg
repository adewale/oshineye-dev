<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="sunrise-deploy">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <defs>
    <linearGradient id="srd-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8b76b"/>
      <stop offset="0.6" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#faf3e0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#srd-sky)"/>
  <g>
    <circle cx="80" cy="200" r="58" fill="#7f0000"/>
    <circle cx="80" cy="200" r="40" fill="#d49431"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#1a1f2e" stroke-width="0.8" opacity="0.35"/>
  </g>
  <g transform="translate(180 80)">
    <rect x="0" y="0" width="190" height="120" fill="#faf3e0" stroke="#1a1f2e" stroke-width="1"/>
    <rect x="0" y="0" width="190" height="20" fill="#1a1f2e"/>
    <text x="10" y="14" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#d49431">wrangler deploy</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#1a1f2e" transform="translate(10 36)">
      <text y="0" opacity="0.75">▸ bundling worker…</text>
      <text y="14" opacity="0.75">▸ uploading assets…</text>
      <text y="28" opacity="0.75">▸ binding D1: morning</text>
      <text y="42" opacity="0.75">▸ binding KV: cache</text>
      <text y="56" fill="#6e8855" font-weight="700">✓ deployed in 3.2s</text>
      <text y="70" fill="#7f0000" font-weight="700">→ sunrise.workers.dev</text>
    </g>
  </g>
  <g transform="translate(178 134)" stroke="#7f0000" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="-100" y1="40" x2="0" y2="40"/>
    <polygon points="-6,36 4,40 -6,44" fill="#7f0000"/>
  </g>
  <text x="200" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55" text-anchor="middle">deploys before standup</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
