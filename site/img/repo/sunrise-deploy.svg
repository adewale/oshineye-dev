<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="sunrise-deploy">
  <defs>
    <linearGradient id="srd-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8b76b"/>
      <stop offset="0.6" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#faf3e0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#srd-sky)"/>
  <g>
    <circle cx="80" cy="200" r="58" fill="#7f0000"/>
    <circle cx="80" cy="200" r="40" fill="#d49431"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#1a1f2e" stroke-width="0.8" opacity="0.35"/>
  </g>
  <g transform="translate(180 80)">
