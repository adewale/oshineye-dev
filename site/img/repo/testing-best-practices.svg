<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Testing best practices">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(48 50)">
    <g font-family="Georgia, serif" font-size="11" fill="#1a1f2e" opacity="0.7">
      <text x="0" y="14">describe('input parsing')</text>
      <text x="0" y="44">describe('error handling')</text>
      <text x="0" y="74">describe('retries')</text>
      <text x="0" y="104">describe('idempotency')</text>
      <text x="0" y="134">describe('boundary cases')</text>
      <text x="0" y="164">describe('integration')</text>
    </g>
    <g transform="translate(220 0)">
      <g transform="translate(0 6)" stroke="#6e8855" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="0,4 4,8 12,0"/>
      </g>
      <g transform="translate(0 36)" stroke="#6e8855" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="0,4 4,8 12,0"/>
      </g>
      <g transform="translate(0 66)" stroke="#7f0000" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="12" y2="12"/>
        <line x1="12" y1="0" x2="0" y2="12"/>
      </g>
      <g transform="translate(0 96)" stroke="#6e8855" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="0,4 4,8 12,0"/>
      </g>
      <g transform="translate(0 126)" stroke="#6e8855" stroke-width="3" fill="none" stroke-linecap="round">
        <polyline points="0,4 4,8 12,0"/>
      </g>
      <g transform="translate(0 156)" stroke="#d49431" stroke-width="3" fill="none" stroke-linecap="round">
        <circle cx="6" cy="6" r="6" fill="none"/>
      </g>
    </g>
  </g>
  <g transform="translate(48 250)" font-family="Georgia, serif" font-size="11" fill="#1a1f2e" opacity="0.55">
    <text x="0" y="0">5 passing</text>
    <text x="80" y="0" fill="#7f0000" opacity="1" font-weight="700">1 failing</text>
    <text x="160" y="0" fill="#d49431" opacity="1">1 pending</text>
  </g>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
