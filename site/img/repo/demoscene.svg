<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Demoscene">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="dms-bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1c2540"/>
      <stop offset="1" stop-color="#0d1226"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#dms-bg)"/>
  <g stroke="#2a3148" stroke-width="1" fill="none" opacity="0.7">
    <circle cx="200" cy="150" r="40"/>
    <circle cx="200" cy="150" r="80"/>
    <circle cx="200" cy="150" r="120"/>
  </g>
  <line x1="200" y1="150" x2="200" y2="30" stroke="#2a3148" stroke-width="1"/>
  <line x1="200" y1="150" x2="80" y2="150" stroke="#2a3148" stroke-width="1"/>
  <path d="M 200 150 L 322 78 A 140 140 0 0 0 280 30 Z" fill="#d49431" opacity="0.45"/>
  <line x1="200" y1="150" x2="322" y2="78" stroke="#d49431" stroke-width="2"/>
  <g>
    <circle cx="174" cy="118" r="3.5" fill="#7f0000"/>
    <circle cx="248" cy="92" r="3.5" fill="#d49431"/>
    <circle cx="160" cy="174" r="2.5" fill="#f4ecd8"/>
    <circle cx="276" cy="178" r="2.5" fill="#f4ecd8"/>
    <circle cx="234" cy="138" r="3.5" fill="#7f0000"/>
    <circle cx="118" cy="146" r="2.5" fill="#f4ecd8"/>
    <circle cx="304" cy="206" r="2.5" fill="#f4ecd8"/>
