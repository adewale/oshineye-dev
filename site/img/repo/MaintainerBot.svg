<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="MaintainerBot">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(46 52)">
    <rect x="0" y="0" width="96" height="92" fill="#1a1f2e"/>
    <rect x="14" y="22" width="24" height="22" fill="#f4ecd8"/>
    <rect x="58" y="22" width="24" height="22" fill="#f4ecd8"/>
    <circle cx="26" cy="33" r="4" fill="#7f0000"/>
    <circle cx="70" cy="33" r="4" fill="#7f0000"/>
    <rect x="30" y="58" width="36" height="3" fill="#d49431"/>
    <rect x="36" y="68" width="24" height="3" fill="#d49431"/>
    <line x1="48" y1="0" x2="48" y2="-12" stroke="#1a1f2e" stroke-width="2"/>
    <circle cx="48" cy="-14" r="3" fill="#7f0000"/>
    <rect x="-6" y="-6" width="6" height="20" fill="#1a1f2e"/>
    <rect x="96" y="-6" width="6" height="20" fill="#1a1f2e"/>
  </g>
  <g transform="translate(168 50)">
    <rect x="0" y="0" width="190" height="200" fill="#faf3e0" stroke="#1a1f2e" stroke-width="1"/>
    <rect x="0" y="0" width="190" height="22" fill="#1a1f2e"/>
    <text x="10" y="15" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#f4ecd8">daily report</text>
    <text x="180" y="15" font-family="Georgia, serif" font-size="9" fill="#f4ecd8" opacity="0.7" text-anchor="end">apr 24</text>
    <g transform="translate(10 36)" font-family="Georgia, serif" font-size="10" fill="#1a1f2e">
      <circle cx="6" cy="0" r="4" fill="#7f0000"/>
      <text x="18" y="3" font-weight="700">3 stale issues</text>
      <text x="18" y="18" opacity="0.65" font-size="9">labeled bug, no replies &gt; 30d</text>
    </g>
    <g transform="translate(10 80)" font-family="Georgia, serif" font-size="10" fill="#1a1f2e">
      <circle cx="6" cy="0" r="4" fill="#d49431"/>
      <text x="18" y="3" font-weight="700">5 PRs awaiting review</text>
      <text x="18" y="18" opacity="0.65" font-size="9">2 with mergeable conflicts</text>
    </g>
    <g transform="translate(10 124)" font-family="Georgia, serif" font-size="10" fill="#1a1f2e">
      <circle cx="6" cy="0" r="4" fill="#6e8855"/>
      <text x="18" y="3" font-weight="700">CI green on main</text>
      <text x="18" y="18" opacity="0.65" font-size="9">42 builds, 0 flakes</text>
    </g>
    <g transform="translate(10 168)" font-family="Georgia, serif" font-size="10" fill="#1a1f2e">
      <circle cx="6" cy="0" r="4" fill="#2d6377"/>
      <text x="18" y="3" font-weight="700">2 new contributors</text>
    </g>
  </g>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
