      <text x="148" y="74" font-size="9" fill="#1a1f2e">07</text>
      <text x="148" y="96" font-size="14" font-weight="700" fill="#1a1f2e" text-anchor="end">N</text>
      <text x="200" y="126" font-size="9" fill="#f7efde">26</text>
