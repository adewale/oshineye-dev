<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="flux-search">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(40 36)">
    <rect x="0" y="0" width="220" height="22" fill="#7f0000"/>
    <text x="14" y="16" font-family="Georgia, serif" font-size="11" font-weight="800" fill="#f4ecd8" letter-spacing="0.06em">FLUX REVIEW</text>
    <text x="206" y="16" font-family="Georgia, serif" font-size="9" fill="#f4ecd8" opacity="0.7" text-anchor="end">#74</text>
    <rect x="0" y="22" width="220" height="36" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.6"/>
    <line x1="12" y1="32" x2="172" y2="32" stroke="#1a1f2e" stroke-width="0.6" opacity="0.45"/>
    <line x1="12" y1="40" x2="208" y2="40" stroke="#1a1f2e" stroke-width="0.6" opacity="0.45"/>
    <line x1="12" y1="48" x2="160" y2="48" stroke="#1a1f2e" stroke-width="0.6" opacity="0.45"/>
  </g>
  <g transform="translate(46 116)" opacity="0.85">
    <rect x="0" y="0" width="200" height="22" fill="#7f0000" opacity="0.18"/>
    <rect x="0" y="0" width="200" height="22" fill="none" stroke="#7f0000" stroke-width="1"/>
    <text x="10" y="16" font-family="Georgia, serif" font-size="11" fill="#1a1f2e">…the <tspan fill="#7f0000" font-weight="700">latent space</tspan> of cities…</text>
  </g>
  <g transform="translate(46 148)">
    <rect x="0" y="0" width="200" height="22" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.6"/>
    <text x="10" y="16" font-family="Georgia, serif" font-size="11" fill="#1a1f2e" opacity="0.6">…walks in <tspan fill="#7f0000" opacity="1">embedding</tspan> space…</text>
  </g>
  <g transform="translate(46 180)">
    <rect x="0" y="0" width="200" height="22" fill="#faf3e0" stroke="#1a1f2e" stroke-width="0.6"/>
    <text x="10" y="16" font-family="Georgia, serif" font-size="11" fill="#1a1f2e" opacity="0.6">…drifting through ideas…</text>
  </g>
  <g transform="translate(290 80)">
    <rect x="0" y="0" width="80" height="32" fill="#faf3e0" stroke="#1a1f2e" stroke-width="1"/>
    <text x="10" y="20" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1a1f2e">"latent"_</text>
    <line x1="60" y1="6" x2="60" y2="26" stroke="#7f0000" stroke-width="1.5">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <g transform="translate(290 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#7f0000" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="58" y2="16" stroke="#d49431" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="32" y2="32" stroke="#2d6377" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="4" font-family="Georgia, serif" font-size="8" fill="#7f0000">lex</text>
    <text x="68" y="20" font-family="Georgia, serif" font-size="8" fill="#d49431">+sem</text>
    <text x="68" y="36" font-family="Georgia, serif" font-size="8" fill="#2d6377">edge</text>
  </g>
  <text x="40" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">hybrid search across the archive</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
