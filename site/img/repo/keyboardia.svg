      <rect x="132" y="6" width="36" height="44" fill="#2a3148"/>
      <rect x="174" y="6" width="36" height="44" fill="#7f0000"/>
      <rect x="216" y="6" width="36" height="44" fill="#d49431"/>
      <rect x="258" y="6" width="36" height="44" fill="#2a3148"/>
      <rect x="300" y="6" width="36" height="44" fill="#7f0000"/>
    </g>
  </g>
  <g>
