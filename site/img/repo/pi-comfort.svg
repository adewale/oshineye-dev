<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="pi-comfort">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <!-- user message, right side -->
  <g transform="translate(186 38)">
    <path d="M 0 0 L 168 0 Q 180 0 180 12 L 180 38 Q 180 50 168 50 L 28 50 L 14 64 L 14 50 Q 0 50 0 38 Z" fill="#2d6377"/>
    <text x="14" y="20" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#f4ecd8" opacity="0.85">you</text>
    <line x1="14" y1="26" x2="166" y2="26" stroke="#f4ecd8" stroke-width="1" opacity="0.4"/>
    <text x="14" y="44" font-family="Georgia, serif" font-size="11" fill="#f4ecd8">help me draft that intro</text>
  </g>
  <!-- pi response, left side -->
  <g transform="translate(34 116)">
    <path d="M 0 0 L 222 0 Q 236 0 236 14 L 236 100 Q 236 114 222 114 L 36 114 L 22 134 L 22 114 Q 0 114 0 100 Z" fill="#7f0000"/>
    <g transform="translate(14 18)">
      <circle cx="6" cy="0" r="7" fill="#f4ecd8"/>
      <text x="6" y="3" font-family="Georgia, serif" font-size="9" font-weight="900" fill="#7f0000" text-anchor="middle">π</text>
    </g>
    <text x="34" y="22" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#f4ecd8" opacity="0.85">pi</text>
    <line x1="14" y1="30" x2="222" y2="30" stroke="#f4ecd8" stroke-width="1" opacity="0.4"/>
    <text x="14" y="48" font-family="Georgia, serif" font-size="11" fill="#f4ecd8">Sure! Here's a draft —</text>
    <text x="14" y="64" font-family="Georgia, serif" font-size="11" fill="#f4ecd8">try opening with the tension</text>
    <text x="14" y="80" font-family="Georgia, serif" font-size="11" fill="#f4ecd8">between presence and noise,</text>
    <text x="14" y="96" font-family="Georgia, serif" font-size="11" fill="#f4ecd8">then move into the why…</text>
  </g>
  <!-- export action chip pinned to the Pi response -->
  <g transform="translate(270 156)">
    <rect x="0" y="0" width="76" height="32" fill="#d49431" stroke="#1a1f2e" stroke-width="1"/>
    <text x="38" y="14" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" font-weight="800" text-anchor="middle">EXPORT</text>
    <text x="38" y="26" font-family="Georgia, serif" font-size="9" fill="#1a1f2e" text-anchor="middle">.html</text>
  </g>
  <text x="36" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">save the reply · share the session</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
