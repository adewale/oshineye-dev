<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="pi-comfort">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="280" height="190" rx="6" fill="#1a1f2e"/>
    <rect x="10" y="10" width="260" height="170" rx="3" fill="#0f1320" stroke="#2a3148" stroke-width="0.6"/>
    <g transform="translate(22 28)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#d49431">good morning, ade</text>
      <line x1="0" y1="8" x2="120" y2="8" stroke="#d49431" stroke-width="1" opacity="0.5"/>
      <g font-family="Georgia, serif" font-size="10" fill="#f4ecd8" opacity="0.75">
        <text y="28">17 °C · partly cloudy</text>
        <text y="46">3 trains to Zürich HB</text>
        <text y="64">first standup in 42 min</text>
        <text y="82">tasks: 4 due today</text>
      </g>
      <g transform="translate(168 14)">
        <rect x="0" y="0" width="40" height="40" fill="#7f0000"/>
        <text x="20" y="16" font-family="Georgia, serif" font-size="8" fill="#f4ecd8" text-anchor="middle" font-weight="700">EXPORT</text>
        <text x="20" y="30" font-family="Georgia, serif" font-size="8" fill="#f4ecd8" text-anchor="middle">.html</text>
      </g>
    </g>
    <g transform="translate(132 168)" fill="#d49431">
      <rect x="0" y="0" width="24" height="6"/>
      <rect x="0" y="-4" width="6" height="10"/>
      <rect x="18" y="-4" width="6" height="10"/>
    </g>
  </g>
  <g transform="translate(176 250)" font-family="Georgia, serif" font-size="11" fill="#1a1f2e" opacity="0.55" text-anchor="middle">
    <text>raspberry pi · reduce friction</text>
  </g>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
