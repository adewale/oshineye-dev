<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="pi-comfort">
  <defs>
    <pattern id="riso-dots" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#7f0000"/>
    </pattern>
    <pattern id="riso-dots-warm" x="0" y="0" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <circle cx="1.7" cy="1.7" r="0.75" fill="#e8b76b"/>
    </pattern>
    <radialGradient id="riso-bloom" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e8b76b" stop-opacity="0.34"/>
      <stop offset="0.7" stop-color="#a83838" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7f0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riso-vignette" cx="0.5" cy="0.55" r="0.88">
      <stop offset="0.5" stop-color="#1a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f4ecd8"/>
  <!-- terminal window (Pi is a terminal coding harness) -->
  <g transform="translate(28 32)">
    <rect x="0" y="0" width="296" height="212" rx="4" fill="#1a1f2e"/>
    <rect x="0" y="0" width="296" height="22" rx="4" fill="#0f1320"/>
    <rect x="0" y="14" width="296" height="8" fill="#0f1320"/>
    <circle cx="14" cy="11" r="3.2" fill="#7f0000"/>
    <circle cx="28" cy="11" r="3.2" fill="#d49431"/>
    <circle cx="42" cy="11" r="3.2" fill="#6e8855"/>
    <text x="148" y="15" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#f4ecd8" opacity="0.55" text-anchor="middle">~ pi</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="10" transform="translate(14 42)">
      <!-- user prompt -->
      <text y="0"><tspan fill="#d49431" font-weight="700">π&gt;</tspan> <tspan fill="#f4ecd8">draft an intro for my essay</tspan></text>
      <!-- response, muted -->
      <text y="20" fill="#f4ecd8" opacity="0.7">Try opening with the tension</text>
      <text y="34" fill="#f4ecd8" opacity="0.7">between presence and noise,</text>
      <text y="48" fill="#f4ecd8" opacity="0.7">then move into the why…</text>
      <!-- pi-comfort command in action -->
      <text y="78"><tspan fill="#d49431" font-weight="700">π&gt;</tspan> <tspan fill="#a83838">/comfort-export-html</tspan></text>
      <text y="98" fill="#6e8855">  &#8594; session-2026-05.html  &#10003;</text>
      <text y="112" fill="#f4ecd8" opacity="0.5">  opens in browser</text>
      <text y="142"><tspan fill="#d49431" font-weight="700">π&gt;</tspan> <tspan fill="#f4ecd8">_</tspan></text>
    </g>
  </g>
  <!-- HTML file artifact, popped out to the right -->
  <g transform="translate(326 100)">
    <rect x="0" y="0" width="56" height="68" fill="#faf3e0" stroke="#1a1f2e" stroke-width="1.5"/>
    <rect x="0" y="0" width="56" height="14" fill="#7f0000"/>
    <text x="28" y="10" font-family="Georgia, serif" font-size="8" font-weight="800" fill="#f4ecd8" text-anchor="middle">.html</text>
    <g stroke="#1a1f2e" stroke-width="0.6" opacity="0.55">
      <line x1="8" y1="24" x2="48" y2="24"/>
      <line x1="8" y1="32" x2="44" y2="32"/>
      <line x1="8" y1="40" x2="48" y2="40"/>
      <line x1="8" y1="48" x2="38" y2="48"/>
      <line x1="8" y1="56" x2="46" y2="56"/>
    </g>
  </g>
  <text x="36" y="280" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1a1f2e" opacity="0.55">small commands · UI affordances · reduces friction</text>
  <g aria-hidden="true" style="pointer-events:none">
    <rect width="400" height="300" fill="url(#riso-bloom)" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-dots)" opacity="0.16" style="mix-blend-mode:multiply"/>
    <rect width="400" height="300" fill="url(#riso-dots-warm)" opacity="0.08" style="mix-blend-mode:screen"/>
    <rect width="400" height="300" fill="url(#riso-vignette)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
